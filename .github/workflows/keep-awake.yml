name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL with Headless Browser
        run: |
          npm init -y
          npm install playwright
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            console.log('Visiting Streamlit app...');
            await page.goto('https://rpl-assist.streamlit.app', { waitUntil: 'networkidle' });
            console.log('Waiting 5 seconds for WebSocket to connect...');
            await page.waitForTimeout(5000);
            console.log('Success! Closing browser.');
            await browser.close();
          })();
          "
