id: "QP-DEMO-001"
title: "Demo Trade: General Plumber"
trade: "Plumbing"
version: "1.0"
tasks:
  - id: "TASK-PL-01"
    name: "Install Basic Pipe Fittings"
    description: "Install, connect, and test basic PVC or CPVC pipe fittings."
    criteria: "Demonstrates ability to measure, cut, join, and test pipes without leaks."
    evidence_requirements: "Image or video of a completed pipe joint."
    assessability: "Remote"
    rubric:
      1: "Not demonstrated or severe leaks."
      2: "Partially demonstrated, minor leaks or poor alignment."
      3: "Competent, no leaks, acceptable alignment."
      4: "Strongly demonstrated, perfect alignment, clean joints, follows safety protocols."
  - id: "TASK-PL-02"
    name: "Diagnose Water Pressure Issue"
    description: "Identify the cause of low water pressure in a residential setup."
    criteria: "Demonstrates logical troubleshooting steps and identifies common issues (clog, valve, pump)."
    evidence_requirements: "Text or audio explaining the troubleshooting process."
    assessability: "Remote"
    rubric:
      1: "Cannot explain basic troubleshooting."
      2: "Identifies only obvious issues with prompting."
      3: "Logically troubleshoots and identifies correct cause."
      4: "Troubleshoots efficiently and suggests preventive measures."
  - id: "TASK-PL-03"
    name: "Weld High-Pressure Joint"
    description: "Perform welding on a high-pressure metal pipe."
    criteria: "Demonstrates structural welding capable of holding high pressure safely."
    evidence_requirements: "In-person observation required for safety reasons."
    assessability: "In-Person"
    rubric:
      1: "Unsafe or failed weld."
      2: "Weak weld, does not pass pressure test."
      3: "Competent weld, passes pressure test safely."
      4: "Excellent weld, smooth finish, passes all stress tests."
